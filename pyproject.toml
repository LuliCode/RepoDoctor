[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repodoctor"
version = "0.1.0"
description = "A Python fault localization agent for multi-module Java applications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
dependencies = [
  "javalang>=0.13,<0.14", "mcp>=1.12,<2", "langgraph>=0.2,<2",
  "openai>=1.54,<3", "pydantic>=2.7,<3", "python-dotenv>=1,<2",
  "streamlit>=1.40,<2", "httpx>=0.27,<1",
]

[project.optional-dependencies]
vector = [
  "numpy>=1.26,<3", "pyarrow>=15", "torch>=2.6,<3",
  "sentence-transformers>=3.4,<4", "transformers>=4.49,<5",
]
linearrag = [
  "numpy>=1.26,<3", "pyarrow>=15", "igraph>=0.11,<0.12",
  "torch>=2.6,<3", "sentence-transformers>=3.4,<4", "transformers>=4.49,<5",
]

[project.scripts]
repodoctor = "repodoctor.cli:main"
repodoctor-mcp = "repodoctor.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"repodoctor._vendor.linearrag" = ["LICENSE.txt"]
